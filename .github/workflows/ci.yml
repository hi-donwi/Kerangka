name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, conformance, examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Typecheck and the test runner read the workspace from source (`paths` in
      # `tsconfig.json`, aliases in `vitest.config.ts`), so they do not need this build and
      # cannot be fooled by a stale one. Two tests still spawn a real process and do need
      # it: the Python sidecar smoke drives the built CLI, and the cross-process session
      # tests open the built store. The build comes before them so those two run rather
      # than fail or skip on a clean checkout.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Conformance suite
        run: npm run test:conformance

      - name: Examples (kerangka check + kerangka verify + kerangka test)
        run: npm run examples:verify

      - name: Sidecar from a non-JavaScript client (Python over stdio JSON-RPC)
        run: python3 scripts/sidecar-smoke.py
