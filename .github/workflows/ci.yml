name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, conformance, examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Conformance suite
        run: npm run test:conformance

      - name: Build
        run: npm run build

      - name: Examples (kerangka check + kerangka verify + kerangka test)
        run: npm run examples:verify

      - name: Sidecar from a non-JavaScript client (Python over stdio JSON-RPC)
        run: python3 scripts/sidecar-smoke.py
