name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, conformance, examples
    runs-on: ubuntu-latest
    env:
      KERANGKA_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/kerangka_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kerangka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kerangka_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Typecheck and the test runner read the workspace from source (`paths` in
      # `tsconfig.json`, aliases in `vitest.config.ts`), so they do not need this build and
      # cannot be fooled by a stale one. Two tests still spawn a real process and do need
      # it: the Python sidecar smoke drives the built CLI, and the cross-process session
      # tests open the built store. The build comes before them so those two run rather
      # than fail or skip on a clean checkout.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Conformance suite
        run: npm run test:conformance

      - name: Examples (kerangka check + kerangka verify + kerangka test)
        run: npm run examples:verify

      - name: Sample projections (KIR, OpenAPI, JSON Schema, UIDL)
        run: node scripts/generate-samples.mjs

      - name: Sidecar from a non-JavaScript client (Python over stdio JSON-RPC)
        run: python3 scripts/sidecar-smoke.py

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust SDK
        run: cargo test --manifest-path sdk/rust/Cargo.toml

      # The Go, Python, and Dart SDKs carried tests that no CI job ran, so a regression in them
      # (or a fail-open gap, ADR-0044) could ship unseen. They run here now.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod

      - name: Test Go SDK
        working-directory: sdk/go
        run: |
          go vet ./...
          go test ./...

      - name: Test Python SDK
        run: PYTHONPATH=sdk/python/src python3 -m unittest discover -s sdk/python/tests

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Test Dart SDK
        working-directory: sdk/dart
        run: |
          dart pub get
          dart analyze
          dart test

  docs:
    name: Docs site, kitchen sink, samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-site/package-lock.json
            kitchen-sink/package-lock.json

      - name: Samples manifest
        run: node scripts/verify-samples.mjs

      - name: Install docs site
        working-directory: docs-site
        run: npm ci

      - name: Audit docs dependencies (including build tools)
        working-directory: docs-site
        run: npm run audit:security

      - name: Build docs site and check internal and sample links
        working-directory: docs-site
        run: npm run verify

      - name: Install kitchen sink
        working-directory: kitchen-sink
        run: npm ci

      - name: Audit kitchen sink dependencies (including build tools)
        working-directory: kitchen-sink
        run: npm run audit:security

      - name: Build workspace for browser engine and sample KIR
        run: |
          npm ci
          npm run build

      - name: Typecheck and build kitchen sink
        working-directory: kitchen-sink
        run: |
          npm run typecheck
          npm run build

      - name: Install Playwright browser
        working-directory: kitchen-sink
        run: npx playwright install --with-deps chromium

      - name: Docs browser tests (content, navigation, search)
        working-directory: docs-site
        run: npm run test:e2e

      - name: Kitchen sink browser tests (golden path, reset, mobile, keyboard, budget)
        working-directory: kitchen-sink
        run: npm run test:e2e
