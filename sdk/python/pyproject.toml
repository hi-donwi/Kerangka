[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kerangka-sdk"
version = "0.1.0"
description = "Kerangka SDK and runtime ports for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
